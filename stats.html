<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AniBridge 접속 통계</title>
<style>
  :root{ --bg:#131A2B; --card:#1B2438; --line:#2A3651; --text:#EFE9DE; --dim:#A6AFC4; --g1:#8FD9AE; --g3:#E1BA83; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .card .lbl{font-size:12px;color:var(--dim);margin-bottom:6px}
  .card .val{font-size:26px;font-weight:800}
  .card .val small{font-size:13px;color:var(--dim);font-weight:600}
  h2{font-size:15px;margin:26px 0 10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:600;font-size:12px}
  .bar{height:6px;background:var(--g1);border-radius:3px;display:inline-block;min-width:2px;vertical-align:middle}
  .wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
  .zero{color:#5C6780}
  .err{background:#3A1F26;border:1px solid #6B2E3C;padding:14px;border-radius:12px;color:#FF8FA3}
  .foot{margin-top:26px;color:var(--dim);font-size:12px;line-height:1.7}
</style>
</head>
<body>
<h1>🐾 AniBridge 접속 통계</h1>
<div class="sub" id="sub">불러오는 중…</div>
<div id="app"></div>

<script>
const KEY = new URLSearchParams(location.search).get('key') || 'anibridge2026';
const API = 'https://anibridge-api.koreagwangju.workers.dev/stats?days=30&key=' + encodeURIComponent(KEY);
const PLAT = { web:'웹', android:'구글 앱', ios:'애플 앱' };
const FLAG = { KR:'🇰🇷 한국', US:'🇺🇸 미국', JP:'🇯🇵 일본', CN:'🇨🇳 중국', XX:'기타' };

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

fetch(API).then(r=>{ if(!r.ok) throw new Error(r.status===401?'접속 키가 올바르지 않습니다':'서버 오류 '+r.status); return r.json(); })
.then(function(d){
  const days = d.days || [];
  const today = days[0] || {total:0};
  const sum = k => days.reduce((a,x)=>a+(x[k]||0),0);
  const week = days.slice(0,7).reduce((a,x)=>a+(x.total||0),0);

  const platTotal = (d.all && d.all.platform) || {};
  const ctryTotal = (d.all && d.all.country) || {};

  const all = d.all || {};
  const todayPer = (today.users||0) > 0 ? ((today.total||0)/today.users).toFixed(1) : null;
  let h = '<h2 style="margin-top:0">오늘</h2><div class="cards">'
    + cardBig('들어온 사람', today.users||0, '명', '오늘 접속한 사람 수')
    + cardBig('들어온 횟수', today.total||0, '회', '앱을 연 총 횟수')
    + cardBig2('1인당 방문', (todayPer||'0.0')+'회', '한 사람이 몇 번 열었나')
    + '</div>';

  // ── 스토어 다운로드 수 ──
  const st = d.store || {};
  const g = st.google, a = st.apple;
  h += '<h2>스토어 다운로드 <span style="color:var(--dim);font-weight:400;font-size:12px">'
     + (st.updated ? '(' + esc(st.updated) + ' 갱신)' : '') + '</span></h2><div class="cards">';
  h += storeCard('🤖 구글 플레이', g);
  h += storeCard('🍎 앱 스토어', a);
  if (g && a && (g.total != null) && (a.total != null)) {
    h += '<div class="card" style="border-color:rgba(225,186,131,0.4)"><div class="lbl">합계</div>'
       + '<div class="val" style="color:var(--g3);font-size:32px">' + (g.total + a.total).toLocaleString()
       + ' <small>건</small></div></div>';
  }
  h += '</div>';

  h += '<h2>최근</h2><div class="cards">'
    + card('7일 방문', week, '회')
    + card('30일 방문', sum('total'), '회')
    + card('오늘 새로 온 사람', today.newUsers||0, '명')
    + '</div>';

  h += '<h2>지금까지 누계 <span style="color:var(--dim);font-weight:400;font-size:12px">'
     + (all.since ? '('+esc(all.since)+' 부터)' : '') + '</span></h2>'
     + '<div class="cards">'
     + cardBig('들어온 사람', all.newUsers||0, '명', '중복 없는 실제 사람 수')
     + cardBig('들어온 횟수', all.total||0, '회', '앱을 연 횟수 전부')
     + cardBig2('하루 1인당 방문',
         ((all.userDays||0) > 0 ? ((all.total||0)/all.userDays).toFixed(1) : '0.0')+'회',
         '높을수록 다시 찾는 앱')
     + '</div>';

  h += '<h2>어디서 들어왔나 <span style="color:var(--dim);font-weight:400;font-size:12px">(누계)</span></h2><div class="wrap"><table>';
  const platRows = Object.entries(platTotal).sort((a,b)=>b[1]-a[1]);
  h += platRows.length ? platRows.map(([k,v])=>row(PLAT[k]||k, v, platRows[0][1])).join('') : emptyRow();
  h += '</table></div>';

  h += '<h2>국가 <span style="color:var(--dim);font-weight:400;font-size:12px">(누계)</span></h2><div class="wrap"><table>';
  const ctryRows = Object.entries(ctryTotal).sort((a,b)=>b[1]-a[1]).slice(0,10);
  h += ctryRows.length ? ctryRows.map(([k,v])=>row(FLAG[k]||k, v, ctryRows[0][1])).join('') : emptyRow();
  h += '</table></div>';

  h += '<h2>날짜별</h2><div class="wrap"><table><tr><th>날짜</th><th>이용자</th><th>방문</th><th>1인당</th><th>웹</th><th>구글</th><th>애플</th></tr>';
  const max = Math.max(1, ...days.map(x=>x.total||0));
  h += days.map(function(x){
    const p = x.platform||{}, z = (x.total||0)===0 ? ' class="zero"' : '';
    const per = (x.users||0) > 0 ? ((x.total||0)/x.users).toFixed(1) : '-';
    return '<tr'+z+'><td>'+esc(x.date)+'</td>'
      + '<td>'+(x.users||0)+'</td>'
      + '<td><span class="bar" style="width:'+Math.round((x.total||0)/max*40)+'px"></span> '+(x.total||0)+'</td>'
      + '<td>'+per+'</td>'
      + '<td>'+(p.web||0)+'</td><td>'+(p.android||0)+'</td><td>'+(p.ios||0)+'</td></tr>';
  }).join('');
  h += '</table></div>';

  h += '<div class="foot">· <b>방문</b> = 앱을 연 횟수 (1분 안의 중복 신호는 제외) · <b>이용자</b> = 그날 접속한 사람 수<br>'
     + '· <b>1인당</b> = 방문 ÷ 이용자. 한 사람이 하루에 몇 번 여는지 — 높을수록 습관이 된 앱입니다.<br>'
     + '· <b>새 이용자</b> = 그날 이용자 중 우리 앱을 처음 써본 사람 (나머지는 다시 온 사람)<br>'
     + '· 개인을 식별하는 정보는 저장하지 않습니다 (기기·이름·위치 상세 없음).<br>'
     + '· 기록은 90일 후 자동 삭제됩니다.<br>'
     + '· 앱에 통계 기능을 심은 날부터 쌓입니다.</div>';

  document.getElementById('app').innerHTML = h;
  const now = new Date(Date.now()+9*3600e3);
  const hh = String(now.getUTCHours()).padStart(2,'0'), mm = String(now.getUTCMinutes()).padStart(2,'0');
  const wd = ['일','월','화','수','목','금','토'][now.getUTCDay()];
  document.getElementById('sub').innerHTML =
    (days[0]?days[0].date:'') + '(' + wd + ') <b>' + hh + ':' + mm + '</b> 기준 · 서울 시간'
    + ' <a href="javascript:location.reload()" style="color:var(--g1);text-decoration:none;margin-left:8px">새로고침 ↻</a>';
})
.catch(function(e){
  document.getElementById('sub').textContent = '';
  document.getElementById('app').innerHTML = '<div class="err">불러오지 못했습니다 — ' + esc(e.message) + '</div>';
});

function card(l,v,unit){ return '<div class="card"><div class="lbl">'+l+'</div><div class="val">'+v+' <small>'+(unit||'명')+'</small></div></div>'; }
function cardBig2(l,v,note){
  return '<div class="card" style="border-color:rgba(225,186,131,0.35)"><div class="lbl">'+l+'</div>'
    + '<div class="val" style="color:var(--g3);font-size:32px">'+v+'</div>'
    + '<div class="lbl" style="margin:6px 0 0">'+note+'</div></div>';
}
function storeCard(label, s){
  if(!s || s.total == null){
    return '<div class="card"><div class="lbl">'+label+'</div>'
      + '<div class="val zero" style="font-size:19px">준비 중</div>'
      + '<div class="lbl" style="margin:6px 0 0">스토어 데이터 연결 대기</div></div>';
  }
  const recent = s.daily ? Object.keys(s.daily).sort().slice(-7).reduce((a,k)=>a+(s.daily[k]||0),0) : null;
  return '<div class="card"><div class="lbl">'+label+'</div>'
    + '<div class="val">'+Number(s.total).toLocaleString()+' <small>건</small></div>'
    + (recent!=null ? '<div class="lbl" style="margin:6px 0 0">최근 7일 +'+recent+'</div>' : '')
    + '</div>';
}
function cardBig(l,v,unit,note){
  return '<div class="card" style="border-color:rgba(143,217,174,0.35)"><div class="lbl">'+l+'</div>'
    + '<div class="val" style="color:var(--g1);font-size:32px">'+v.toLocaleString()+' <small>'+(unit||'명')+'</small></div>'
    + (note?'<div class="lbl" style="margin:6px 0 0">'+note+'</div>':'') + '</div>';
}
function row(l,v,max){ return '<tr><td>'+esc(l)+'</td><td><span class="bar" style="width:'+Math.round(v/max*60)+'px"></span> '+v+'</td></tr>'; }
function emptyRow(){ return '<tr><td colspan="2" class="zero">아직 기록이 없습니다</td></tr>'; }
</script>
</body>
</html>
